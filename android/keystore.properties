# Keystore bersama untuk build CI & debug — BUKAN kunci rilis produksi.
#
# Tujuan: semua APK hasil CI ditandatangani dengan kunci yang SAMA sehingga
# dapat di-upgrade di tempat (tanpa uninstall lebih dulu).
#
# Di CI rilis (tag v*), file ini DITULIS ULANG dari GitHub Secrets
# (KEYSTORE_BASE64, dst) agar rilis memakai kunci rilis asli.
storeFile=arkacode.keystore
storePassword=arkacode
keyAlias=arkacode
keyPassword=arkacode
